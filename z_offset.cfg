######################################################################
# KAT PERSISTENT PRINT Z OFFSET
# Distributed under the GNU GPLv3 license; see LICENSE.
#
# Generic user compensation, independent of the probe calibration/model.
# Positive values increase nozzle-to-bed clearance during print moves.
#
# Machine setup:
#   [save_variables]
#   filename: ~/printer_data/config/kat-variables.ini
#   [gcode_macro KAT]
#   variable_start_use_saved_z_offset: True
#
# Core KAT includes this file; persistence is opt-in. Existing save_variables
# installations can use their existing file. KAT owns only kat_print_z_offset.
# Saving writes immediately without SAVE_CONFIG, restart, or movement.
# These macros never modify a probe/model z_offset and never use MOVE=1.
######################################################################

[gcode_macro KAT_SAVE_Z_OFFSET]
description: Save current total print Z offset, or an explicit absolute Z=value, without moving
gcode:
    {% for key in params %}
        {% if key != 'Z' %}
            {action_raise_error("KAT_SAVE_Z_OFFSET accepts only the optional absolute Z=value parameter")}
        {% endif %}
    {% endfor %}
    {% if 'save_variables' not in printer %}
        {action_raise_error("KAT Z offset requires a [save_variables] section with a writable filename")}
    {% endif %}
    {% set kat = printer["gcode_macro KAT"] %}
    {% set limit = kat.z_offset_max_abs|default(1.0)|float(default=none) %}
    {% if limit is none or not (limit >= 0.001 and limit <= 5.0) %}
        {action_raise_error("KAT z_offset_max_abs must be between 0.001 and 5.0 mm")}
    {% endif %}
    {% set value = params.Z|float(default=none) if params.Z is defined else printer.gcode_move.homing_origin.z|float(default=none) %}
    {% if value is none or not (value >= -limit and value <= limit) %}
        {action_raise_error("KAT Z offset must be a finite number within +/-%.3f mm" % limit)}
    {% endif %}
    SAVE_VARIABLE VARIABLE=kat_print_z_offset VALUE={value}
    RESPOND PREFIX="KAT_Z" MSG="Saved print Z offset {value|round(6)} mm. Active offset is unchanged; the saved value will be applied after print calibration."

[gcode_macro KAT_APPLY_Z_OFFSET]
description: Apply the saved absolute print Z offset without issuing a move
gcode:
    {% if params|length > 0 %}
        {action_raise_error("KAT_APPLY_Z_OFFSET takes no parameters and never issues an immediate move")}
    {% endif %}
    {% set kat = printer["gcode_macro KAT"] %}
    {% if kat.start_use_saved_z_offset|default(False)|int == 1 %}
        {% if 'save_variables' not in printer %}
            {action_raise_error("Enable [save_variables] before using KAT persistent print Z offset")}
        {% endif %}
        {% set limit = kat.z_offset_max_abs|default(1.0)|float(default=none) %}
        {% if limit is none or not (limit >= 0.001 and limit <= 5.0) %}
            {action_raise_error("KAT z_offset_max_abs must be between 0.001 and 5.0 mm")}
        {% endif %}
        {% set value = printer.save_variables.variables.kat_print_z_offset|default(0.0)|float(default=none) %}
        {% if value is none or not (value >= -limit and value <= limit) %}
            {action_raise_error("Saved KAT Z offset is invalid or exceeds +/-%.3f mm; check the variables file" % limit)}
        {% endif %}
        # Absolute assignment makes repeated calls idempotent; never stack Z_ADJUST.
        SET_GCODE_OFFSET Z={value} MOVE=0
        RESPOND PREFIX="KAT_Z" MSG="Applied saved print Z offset {value|round(6)} mm; no immediate movement."
    {% else %}
        RESPOND PREFIX="KAT_Z" MSG="Persistent print Z offset is disabled."
    {% endif %}

[gcode_macro KAT_SHOW_Z_OFFSET]
description: Show the saved print Z offset and current total runtime offset
gcode:
    {% if params|length > 0 %}
        {action_raise_error("KAT_SHOW_Z_OFFSET takes no parameters")}
    {% endif %}
    {% if 'save_variables' not in printer %}
        RESPOND PREFIX="KAT_Z" MSG="No save_variables storage configured."
    {% else %}
        {% set value = printer.save_variables.variables.kat_print_z_offset|default(0.0)|float(default=none) %}
        {% if value is none or not (value >= -5.0 and value <= 5.0) %}
            {action_raise_error("Saved KAT Z offset is not a finite value within +/-5 mm")}
        {% endif %}
        {% set active = printer.gcode_move.homing_origin.z|float %}
        {% set enabled = printer["gcode_macro KAT"].start_use_saved_z_offset|default(False)|int %}
        RESPOND PREFIX="KAT_Z" MSG="Saved={value|round(6)} mm; active total={active|round(6)} mm; start integration enabled={enabled}."
    {% endif %}

[gcode_macro _KAT_PREPARE_Z_OFFSET]
description: Validate persistent compensation and clear runtime Z offset before print calibration
gcode:
    {% set kat = printer["gcode_macro KAT"] %}
    {% if kat.start_use_saved_z_offset|default(False)|int == 1 %}
        {% if 'save_variables' not in printer %}
            {action_raise_error("Enable [save_variables] before using KAT persistent print Z offset")}
        {% endif %}
        {% set limit = kat.z_offset_max_abs|default(1.0)|float(default=none) %}
        {% set value = printer.save_variables.variables.kat_print_z_offset|default(0.0)|float(default=none) %}
        {% if limit is none or not (limit >= 0.001 and limit <= 5.0) %}
            {action_raise_error("KAT z_offset_max_abs must be between 0.001 and 5.0 mm")}
        {% endif %}
        {% if value is none or not (value >= -limit and value <= limit) %}
            {action_raise_error("Saved KAT Z offset is invalid or exceeds +/-%.3f mm; check the variables file" % limit)}
        {% endif %}
        # Clear last print's runtime correction before homing/probing, without moving.
        SET_GCODE_OFFSET Z=0 MOVE=0
    {% endif %}
