######################################################################
# KAT RESONANCE TOOLS
#
# Standard KAT tooling for running resonance tests and generating
# input shaper graphs from Klipper CSV files.
#
# Requirements:
# - gcode_shell_command support must be installed and enabled.
# - Klipper/Kalico resonance testing must be configured.
# - Klipper's scripts/calibrate_shaper.py must exist.
# - Klipper's scripts/graph_accelerometer.py must exist.
# - The Klipper/Kalico Python environment must provide cffi, numpy and
#   matplotlib. KAT does not install these optional graph dependencies.
#
# Dependency guides:
# - https://docs.kalico.gg/Measuring_Resonances.html
# - https://www.klipper3d.org/Measuring_Resonances.html
#
# Expected repository location:
# ~/printer_data/config/KAT/
#
# Expected script location:
# ~/printer_data/config/KAT/scripts/
#
# Expected output location:
# ~/printer_data/config/input_shaper/
#
# Notes:
# - X/Y resonance graphs use Klipper's calibrate_shaper.py.
# - Z resonance graph uses Klipper's graph_accelerometer.py.
# - TEST_RESONANCES AXIS=Z must be supported by the installed firmware.
######################################################################


######################################################################
# Shell commands
######################################################################

[gcode_shell_command kat_generate_resonance_graph_x]
command: bash -lc 'bash "$HOME/printer_data/config/KAT/scripts/generate-resonance-graph-x.sh"'
timeout: 120.
verbose: True

[gcode_shell_command kat_generate_resonance_graph_y]
command: bash -lc 'bash "$HOME/printer_data/config/KAT/scripts/generate-resonance-graph-y.sh"'
timeout: 120.
verbose: True

[gcode_shell_command kat_generate_resonance_graph_z]
command: bash -lc 'bash "$HOME/printer_data/config/KAT/scripts/generate-resonance-graph-z.sh"'
timeout: 120.
verbose: True


######################################################################
# RESONANCE CONFIGURATION HELP
#
# This helper is used when [resonance_tester] is not configured.
# The URL is written as plain text so UI clients that auto-link URLs can
# make it clickable.
######################################################################

[gcode_macro _KAT_RESONANCE_NOT_CONFIGURED]
description: Show resonance tester setup help
gcode:
    RESPOND PREFIX="KAT" MSG="Cannot run resonance test: [resonance_tester] is not configured"
    RESPOND PREFIX="KAT" MSG="Add [resonance_tester] and accelerometer configuration in printer.cfg"
    RESPOND PREFIX="KAT" MSG="Klipper guide:"
    RESPOND PREFIX="KAT" MSG="https://www.klipper3d.org/Measuring_Resonances.html"


[gcode_macro KAT_RESONANCE_REQUIREMENTS]
description: Show setup requirements for KAT resonance graph tooling
gcode:
    RESPOND PREFIX="KAT" MSG="Resonance graphs require [resonance_tester], an accelerometer and gcode_shell_command"
    RESPOND PREFIX="KAT" MSG="KAT does not install Python graph packages: cffi, numpy and matplotlib"
    RESPOND PREFIX="KAT" MSG="Kalico guide: https://docs.kalico.gg/Measuring_Resonances.html"
    RESPOND PREFIX="KAT" MSG="Klipper guide: https://www.klipper3d.org/Measuring_Resonances.html"


######################################################################
# Full resonance test workflows
#
# These macros run TEST_RESONANCES first and then generate the graph.
######################################################################

[gcode_macro _KAT_PREPARE_RESONANCE_TEST]
description: Internal preparation for resonance testing
gcode:
    {% set kat = printer["gcode_macro KAT"] %}

    # A resonance test must never start from an unknown kinematic position.
    MAYBE_HOME

    # QGL/Z tilt is independent of START_PRINT so an input-shaper test is
    # prepared correctly even when a user has disabled leveling for prints.
    {% if kat.resonance_use_gantry_level|int == 0 %}
        RESPOND PREFIX="KAT" MSG="Gantry leveling before resonance test disabled, skipping"
    {% elif 'quad_gantry_level' in printer %}
        RESPOND PREFIX="KAT" MSG="Running QUAD_GANTRY_LEVEL before resonance test"
        QUAD_GANTRY_LEVEL
        KAT_HOME_Z_AFTER_LEVEL
    {% elif 'z_tilt' in printer %}
        RESPOND PREFIX="KAT" MSG="Running Z_TILT_ADJUST before resonance test"
        Z_TILT_ADJUST
        KAT_HOME_Z_AFTER_LEVEL
    {% else %}
        RESPOND PREFIX="KAT" MSG="No QGL or Z_TILT configured, skipping gantry leveling"
    {% endif %}

[gcode_macro KAT_GENERATE_SHAPER_GRAPHS]
description: Test and graph resonance; AXIS=X, Y or BOTH (default)
gcode:
    {% set selected_axis = params.AXIS|default("BOTH")|string|trim|upper %}
    {% if selected_axis|length == 0 %}
        {% set selected_axis = "BOTH" %}
    {% endif %}
    {% set print_state = printer.print_stats.state|default("standby")|string|lower if 'print_stats' in printer else "standby" %}
    {% if print_state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="KAT shaper graph test refused while a print is {print_state}"
    {% elif selected_axis not in ["X", "Y", "BOTH", "XY", "ALL"] %}
        RESPOND TYPE=error MSG="KAT shaper graph AXIS must be X, Y or BOTH"
    {% elif 'resonance_tester' not in printer.configfile.settings %}
        _KAT_RESONANCE_NOT_CONFIGURED
    {% else %}
        _KAT_PREPARE_RESONANCE_TEST
        {% if selected_axis in ["X", "BOTH", "XY", "ALL"] %}
            RESPOND PREFIX="KAT" MSG="Running TEST_RESONANCES AXIS=X"
            TEST_RESONANCES AXIS=X
            RESPOND PREFIX="KAT" MSG="Generating X resonance shaper graph"
            RUN_SHELL_COMMAND CMD=kat_generate_resonance_graph_x
        {% endif %}
        {% if selected_axis in ["Y", "BOTH", "XY", "ALL"] %}
            RESPOND PREFIX="KAT" MSG="Running TEST_RESONANCES AXIS=Y"
            TEST_RESONANCES AXIS=Y
            RESPOND PREFIX="KAT" MSG="Generating Y resonance shaper graph"
            RUN_SHELL_COMMAND CMD=kat_generate_resonance_graph_y
        {% endif %}
    {% endif %}


[gcode_macro KAT_GENERATE_SHAPER_GRAPHS_FROM_CSV]
description: Graph existing CSV; AXIS=X, Y or BOTH (default)
gcode:
    {% set selected_axis = params.AXIS|default("BOTH")|string|trim|upper %}
    {% if selected_axis|length == 0 %}
        {% set selected_axis = "BOTH" %}
    {% endif %}
    {% if selected_axis not in ["X", "Y", "BOTH", "XY", "ALL"] %}
        RESPOND TYPE=error MSG="KAT graph-from-CSV AXIS must be X, Y or BOTH"
    {% else %}
        {% if selected_axis in ["X", "BOTH", "XY", "ALL"] %}
            RESPOND PREFIX="KAT" MSG="Generating X resonance shaper graph from existing CSV"
            RUN_SHELL_COMMAND CMD=kat_generate_resonance_graph_x
        {% endif %}
        {% if selected_axis in ["Y", "BOTH", "XY", "ALL"] %}
            RESPOND PREFIX="KAT" MSG="Generating Y resonance shaper graph from existing CSV"
            RUN_SHELL_COMMAND CMD=kat_generate_resonance_graph_y
        {% endif %}
    {% endif %}

[gcode_macro KAT_TEST_RESONANCES_X]
description: Legacy shortcut: test and graph X resonance
gcode:
    KAT_GENERATE_SHAPER_GRAPHS AXIS=X


[gcode_macro KAT_TEST_RESONANCES_Y]
description: Legacy shortcut: test and graph Y resonance
gcode:
    KAT_GENERATE_SHAPER_GRAPHS AXIS=Y


[gcode_macro KAT_TEST_RESONANCES_Z]
description: Run TEST_RESONANCES AXIS=Z and generate the Z resonance graph
gcode:
    {% if 'resonance_tester' not in printer.configfile.settings %}
        _KAT_RESONANCE_NOT_CONFIGURED
    {% else %}
        _KAT_PREPARE_RESONANCE_TEST
        RESPOND PREFIX="KAT" MSG="Running TEST_RESONANCES AXIS=Z"
        RESPOND PREFIX="KAT" MSG="If AXIS=Z is not supported by this firmware/setup, Klipper will report it"
        TEST_RESONANCES AXIS=Z
        RESPOND PREFIX="KAT" MSG="Generating Z resonance graph"
        RUN_SHELL_COMMAND CMD=kat_generate_resonance_graph_z
    {% endif %}
